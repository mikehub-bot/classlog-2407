<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155e75"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="2407班日志"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><link rel="stylesheet" href="style.css"><title>高中2407班·班级日志</title></head><body><header><strong>高中2407班 · 班级日志</strong><span id="status">正在读取本机数据…</span></header><main>
<section id="home" class="page"><h1>今天</h1><div id="homeSummary" class="cards"></div><p id="backupReminder" class="hint"></p><button class="primary" data-page="entry">＋ 快捷记录</button><h2>今天的记录</h2><div id="todayList"></div></section>
<section id="entry" class="page" hidden><h1 id="entryTitle">新增记录</h1><form id="eventForm"><div class="row"><label>类别<select id="category"><option>亮点</option><option>违纪</option><option>请假</option></select></label><label>发生日期<input id="occurred" type="date" required></label></div><label>常用事件</label><div id="presets" class="chips"></div><label>事件名称<input id="eventType" maxlength="80" required placeholder="可点上方常用事件，也可输入其他事件"></label><label>涉及学生 <small>可点选多名学生</small></label><div class="row"><button type="button" id="allScope">全班记录</button><button type="button" id="clearSelected">清空选择</button></div><input id="studentSearch" placeholder="按姓名或学号筛选，已选学生不会丢失"><div id="selectedNames" class="hint"></div><div id="studentPicker" class="picker"></div><label>文字说明<textarea id="details" rows="3" placeholder="可选填"></textarea></label><button class="primary" type="submit">保存记录</button><button type="button" id="cancelEdit" hidden>取消修改</button></form></section>
<section id="history" class="page" hidden><h1>记录管理</h1><div class="row"><input id="historyStudent" placeholder="姓名或学号"><input id="historyDate" type="date"></div><div id="historyFilters" class="chips"><button data-filter="全部" class="on">全部</button><button data-filter="亮点">亮点</button><button data-filter="违纪">违纪</button><button data-filter="请假">请假</button><button data-filter="已删除">已删除</button></div><div id="historyList"></div></section>
<section id="stats" class="page" hidden><h1>统计中心</h1><div class="row"><select id="period"><option value="week">本周</option><option value="month">本月</option><option value="term">本学期</option></select><select id="statsStudent"><option value="">全班</option></select></div><div id="statsSummary" class="cards"></div><h2>类别次数</h2><div id="bars"></div><h2>每周趋势</h2><div id="trend"></div><div id="studentOverview"></div><p class="hint">全班按事件计数一次；个人按该学生参与的事件计数。请假单独统计，不计入违纪。已删除记录不计入统计。</p></section>
<section id="data" class="page" hidden><h1>学生与数据</h1><h2>学生名单</h2><form id="studentForm" class="row"><input id="studentNo" placeholder="学号" required><input id="studentName" placeholder="姓名" required><button type="submit">添加</button></form><div id="roster"></div><h2>备份与恢复</h2><p class="hint">数据仅存此设备的浏览器中。请定期导出备份到“文件”，避免换机、清理网站数据或卸载造成丢失。</p><button id="backup" class="primary">导出完整备份（JSON）</button><p id="backupNote" class="hint"></p><button id="revertRestore" type="button" hidden>撤销最近一次整库恢复</button><label class="fileLabel">从备份恢复<input id="restore" type="file" accept=".json,application/json" hidden></label><label class="fileLabel">导入学生名单<input id="rosterImport" type="file" accept=".json,application/json,.csv,text/csv" hidden></label><button id="exportCsv">导出记录表格（CSV）</button><p class="hint">恢复会替换本机现有数据；应用会暂存恢复前的本机状态，供撤销最近一次恢复（不能代替异地备份）。首次安装请从本地私下导入学生名单，不要将名单上传到公开站点。</p></section>
</main><nav><button data-page="home">首页</button><button data-page="entry">记录</button><button data-page="history">查询</button><button data-page="stats">统计</button><button data-page="data">学生·备份</button></nav><script src="app.js"></script></body></html>
